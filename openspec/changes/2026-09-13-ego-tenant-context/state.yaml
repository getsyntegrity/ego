    decided_by: user
    summary: >
      Five foundational decisions closed against exploration.md §13(b), to be
      treated as settled (not reopened) starting in sdd-propose:
      (1) TenantID is `type TenantID string` — a defined type, not an alias —
      opaque, non-empty, no UUID mandate, with a constructor/validator and
      helpers. Rejected `type TenantID = string` as insufficient isolation.
      (2) The TenantResolver core contract MUST NOT depend on GoAkt. The
      GoAkt runtime MAY transport/configure a resolver via its existing
      extensions mechanism, but that wiring is a runtime-adapter concern, not
      a #001 core-contract decision.
      (3) Resolution and propagation are distinct: TenantResolver resolves
      ONCE at the trust boundary into a TenantContext; propagation is a
      separate concern — local via context.Context, remote/cross-boundary
      via a tenant-aware envelope owned by future TENANT-002. Rule: "resolve
      once at the trust boundary; propagate thereafter."
      (4) The "per-entity vs per-command" scoping question is reformulated,
      not left open: tenant + aggregate identity together form the
      aggregate's effective identity (e.g. Tenant A/Order 123 and Tenant
      B/Order 123 must never share a stream). Command execution context
      carries the tenant; aggregate identity/persistence namespace is
      tenant-scoped; exact physical format deferred to TENANT-002/003. The
      architecture must not allow a global actor whose tenant changes
      arbitrarily per command (confused-deputy risk).
      (5) Single-tenant and multi-tenant share the same TenantContext
      machinery — WithSingleTenant(TenantID) installs a built-in
      resolver/policy, not a second execution model or bypass.
      Additional guidance for propose: TenantContext = TenantID + an
      execution-scope discriminator (Tenant vs Administrative);
      TenantResolver.Resolve(context.Context) (TenantContext, error); the
      normative invariant "Once an execution has a tenant identity, Ego MUST
      NOT permit that identity to change implicitly while crossing command,
      saga, event, persistence or projection boundaries" belongs in the
      future design doc; the architecture-conformance test recommendation
      upgrades from a substring scan to an AST/go-packages/go-list import-
      graph check (tenancy/core MUST NOT import net/http, JWT libs, Ory SDK,
      GoAkt, gRPC transport types, Kafka/NATS/etc), a candidate foundational
      piece for epic #10 as well.
