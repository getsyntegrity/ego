name: pull_request

on:
  pull_request:
    branches:
      - main
      - 'docs/propose-*'
    paths-ignore:
      - '**/readme.md'
      - '**/renovate.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_COLOR: 1
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          check-latest: false
          cache-dependency-path: "**/*.sum"
      - run: go version
      - name: Vendoring and Tidy
        run: go mod tidy && go mod vendor
      - name: Install dependencies
        run: |
          go mod download
      - name: Run Linter
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          args: --timeout 10m --config .golangci.yml
      - name: Determine changed files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed.txt"
      - name: Select packages
        id: select
        shell: bash
        env:
          GOFLAGS: -mod=vendor
        run: |
          if go run ./internal/cmd/ciselect -changed "$RUNNER_TEMP/changed.txt" -out-dir "$RUNNER_TEMP/ci"; then
            :
          else
            echo "::warning::ciselect failed; falling back to the full suite"
            go run ./internal/cmd/ciselect -all -reason "selector failed; full-suite fallback" -out-dir "$RUNNER_TEMP/ci"
          fi
          cat "$RUNNER_TEMP/ci/summary.md" >> "$GITHUB_STEP_SUMMARY"
          echo "mode=$(cat "$RUNNER_TEMP/ci/mode")" >> "$GITHUB_OUTPUT"
      - name: Run tests
        shell: bash
        env:
          GOFLAGS: -mod=vendor
          GO_TEST_RACE: "1"
        run: |
          scripts/ci/go-test.sh "$RUNNER_TEMP/ci" coverage.out
      - name: Note skipped Codecov upload
        if: steps.select.outputs.mode != 'full'
        shell: bash
        run: |
          echo "Coverage not uploaded to Codecov: package selection was partial (mode=${{ steps.select.outputs.mode }}); a partial profile would misstate project coverage. main's full-suite run remains the Codecov source of truth." >> "$GITHUB_STEP_SUMMARY"
      - uses: codecov/codecov-action@v7
        if: steps.select.outputs.mode == 'full'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out # optional
          fail_ci_if_error: false # optional (default = false)
          verbose: false # optional (default = false)
