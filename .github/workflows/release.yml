name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # gate is release.yml's pre-publish backstop (#159, F4 PR-B): it refuses
  # to let anything below it run unless the EXACT tagged commit both is on
  # main and has a build.yml run that completed with conclusion "success".
  # See docs/ci.md, "Release gate", for the full rationale, how to test
  # this job without publishing anything, and a documented pre-existing
  # limitation this gate does not fix.
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"

      - name: Resolve the tagged commit and its main membership
        id: resolve
        shell: bash
        run: |
          # GITHUB_REF is one of the automatic environment variables every
          # Actions run gets (docs.github.com/en/actions/reference/variables-reference);
          # it is a plain shell env var, not a GitHub Actions expression, so
          # it needs no env: passthrough.
          TAG="${GITHUB_REF#refs/tags/}"

          # A lightweight tag already points straight at a commit; an
          # annotated tag points at a tag object that itself points at a
          # commit (possibly through a chain of further tag objects).
          # "^{commit}" dereferences either case down to the commit, so this
          # one line handles both — see docs/ci.md, "Release gate", for why
          # this matters (a bare `git rev-parse "$TAG"` would return an
          # annotated tag's own object SHA, not the commit SHA build.yml
          # ran against).
          SHA=$(git rev-parse "${TAG}^{commit}")
          echo "Tag ${TAG} dereferences to commit ${SHA}"

          git fetch origin main --quiet
          if git merge-base --is-ancestor "${SHA}" origin/main; then
            ON_MAIN=true
          else
            ON_MAIN=false
          fi
          echo "commit ${SHA} on main: ${ON_MAIN}"

          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "on-main=${ON_MAIN}" >> "$GITHUB_OUTPUT"

      - name: Wait for a green build.yml run on the exact tagged commit
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GATE_REPO: ${{ github.repository }}
          GATE_SHA: ${{ steps.resolve.outputs.sha }}
          GATE_ON_MAIN: ${{ steps.resolve.outputs.on-main }}
        run: |
          go run ./internal/cmd/releasegate \
            -repo "$GATE_REPO" \
            -sha "$GATE_SHA" \
            -on-main "$GATE_ON_MAIN" \
            -timeout 20m \
            -interval 30s

  release-ego:
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true

  # prepare-publisher-bump replaces the old release-publishers job (#159,
  # F4 PR-C): main is branch-protected now (required "CI Gate" check,
  # strict, enforce_admins), so nothing may push straight to main or open a
  # PR on its own. This job stops one step earlier than before: it bumps
  # each publisher's go.mod/go.sum to the just-released ego version, pushes
  # that bump on its own branch (release/publishers-<tag>), and prints the
  # exact `gh pr create` command for a human to run. It creates no
  # publisher tags and no publisher GitHub releases — that now happens in
  # the separate, explicitly-dispatched release-publishers.yml workflow
  # once a human has merged the bump PR. See docs/ci.md.
  prepare-publisher-bump:
    runs-on: ubuntu-latest
    needs: release-ego
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # A plain GITHUB_TOKEN is enough here: this job only pushes a new,
          # unprotected release/publishers-<tag> branch (never main), and
          # the job-level `contents: write` permission above already grants
          # that. The old RELEASE_PAT was needed to push straight to main;
          # that push no longer happens.
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"

      - name: Discover publishers
        id: discover-publishers
        shell: bash
        run: |
          PUBLISHERS=""
          for d in publisher/*/; do
            d="${d%/}"
            if [ -f "$d/go.mod" ]; then
              PUBLISHERS="$PUBLISHERS $(basename "$d")"
            fi
          done
          PUBLISHERS="${PUBLISHERS# }"
          echo "Discovered publishers: ${PUBLISHERS}"
          echo "publishers=$PUBLISHERS" >> "$GITHUB_OUTPUT"

      - name: Get ego version from tag
        id: ego-version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Wait for ego module to be available on proxy
        env:
          EGO_VERSION: ${{ steps.ego-version.outputs.version }}
        run: |
          MODULE="github.com/getsyntegrity/ego/v4@${EGO_VERSION}"
          echo "Waiting for ${MODULE} on Go proxy..."
          for i in $(seq 1 30); do
            if go list -m "${MODULE}" 2>/dev/null; then
              echo "Module available on proxy."
              exit 0
            fi
            echo "Attempt $i/30: not yet available, waiting 30s..."
            sleep 30
          done
          echo "::error::Timed out waiting for module on Go proxy"
          exit 1

      - name: Create publisher bump branch from origin/main
        id: create-branch
        env:
          EGO_VERSION: ${{ steps.ego-version.outputs.version }}
        run: |
          BRANCH="release/publishers-${EGO_VERSION}"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin main --quiet

          if git ls-remote --exit-code --heads origin "${BRANCH}" >/dev/null 2>&1; then
            echo "::error::Branch ${BRANCH} already exists on origin. Refusing to overwrite it; delete or merge the existing branch first."
            exit 1
          fi

          # Branch from origin/main, not from whatever ref this job happened
          # to check out (the pushed tag), so the bump commit sits cleanly
          # on top of real main history.
          git checkout -B "${BRANCH}" origin/main

      - name: Update publishers
        env:
          EGO_VERSION: ${{ steps.ego-version.outputs.version }}
          PUBLISHERS: ${{ steps.discover-publishers.outputs.publishers }}
        run: |
          for PUB in $PUBLISHERS; do
            echo "::group::Processing publisher: ${PUB}"

            # Update go.mod
            cd "publisher/${PUB}"
            go get "github.com/getsyntegrity/ego/v4@${EGO_VERSION}"
            go mod tidy
            cd ../..

            # Published verification: this publisher must build against
            # the just-published root version with no local replace, not
            # only with the checked-in `replace ../../` this repo uses for
            # everyday development.
            scripts/ci/verify-published.sh "publisher/${PUB}" "${EGO_VERSION}"

            # Stage changes if any
            if ! git diff --quiet "publisher/${PUB}/go.mod" "publisher/${PUB}/go.sum"; then
              git add "publisher/${PUB}/go.mod" "publisher/${PUB}/go.sum"
              echo "Staged go.mod changes for ${PUB}"
            else
              echo "No go.mod changes for ${PUB}"
            fi

            echo "::endgroup::"
          done

      - name: Commit and push publisher bump branch
        id: push-branch
        env:
          EGO_VERSION: ${{ steps.ego-version.outputs.version }}
          BRANCH: ${{ steps.create-branch.outputs.branch }}
        run: |
          if git diff --cached --quiet; then
            echo "No dependency changes to commit; not pushing ${BRANCH}."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore(publishers): update ego dependency to ${EGO_VERSION}"
          git push origin "${BRANCH}"
          echo "Pushed ${BRANCH} to origin."
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Write step summary
        env:
          EGO_VERSION: ${{ steps.ego-version.outputs.version }}
          BRANCH: ${{ steps.create-branch.outputs.branch }}
          PUSHED: ${{ steps.push-branch.outputs.pushed }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "${PUSHED}" != "true" ]; then
            {
              echo "## Publisher bump: nothing to do"
              echo
              echo "No publisher go.mod/go.sum changes were produced for ego ${EGO_VERSION}; branch ${BRANCH} was not pushed."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          COMPARE_URL="https://github.com/${REPO}/compare/main...${BRANCH}?expand=1"
          PR_BODY="Bumps the publisher submodules' go.mod/go.sum to ego ${EGO_VERSION}. Generated by ${RUN_URL}."

          {
            echo "## Publisher bump ready for review"
            echo
            echo "Branch \`${BRANCH}\` was pushed with the publisher dependency bump to ego ${EGO_VERSION}."
            echo
            echo "Compare: ${COMPARE_URL}"
            echo
            echo "Open the PR by hand:"
            echo
            echo '```bash'
            echo "gh pr create --base main --head ${BRANCH} --title \"chore(publishers): update ego dependency to ${EGO_VERSION}\" --body \"${PR_BODY}\""
            echo '```'
            echo
            echo "After this PR is merged to main, dispatch \`.github/workflows/release-publishers.yml\` (workflow_dispatch) with the merge commit SHA and ego version \`${EGO_VERSION}\` to tag and release the publishers."
          } >> "$GITHUB_STEP_SUMMARY"
