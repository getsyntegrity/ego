# Manual task: update the Go SDK and open a PR to develop.
# Actions -> go-sdk-update -> Run workflow -> version (or "latest").
# The PR goes through the normal CI: tests on the new SDK + the minimum, lint, apidiff, vuln.
name: go-sdk-update

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Go version (e.g. 1.27.1) or "latest"'
        required: true
        default: latest
      raise_min:
        description: 'Also raise the MINIMUM version (the go directive). Forces consumers to use that Go.'
        type: boolean
        default: false
  # Optional: check once a month and open the PR only if there is a new version.
  # schedule:
  #   - cron: '0 6 1 * *'

concurrency:
  group: go-sdk-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # push the chore/go-sdk-* branch
      pull-requests: write   # open the PR and label it
    steps:
      # Checkout with the PAT when available: the push and the PR should trigger the CI
      # (anything created with GITHUB_TOKEN does not trigger workflows).
      - uses: actions/checkout@v7
        with:
          ref: develop
          token: ${{ secrets.ORG_CHECKOUT_TOKEN || github.token }}

      - name: Resolve version
        id: v
        env:
          INPUT: ${{ inputs.version || 'latest' }}
        run: |
          v=$(.github/scripts/go-sdk-update.sh --resolve "$INPUT")
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid version: '$v'"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Current: $(cat .go-version 2>/dev/null || echo '-')  ->  New: $v"

      - uses: ./.github/actions/go-setup
        with:
          go-version: ${{ steps.v.outputs.version }}

      - name: Apply
        env:
          VERSION: ${{ steps.v.outputs.version }}
          RAISE_MIN: ${{ inputs.raise_min && '--raise-min' || '' }}
        run: .github/scripts/go-sdk-update.sh "$VERSION" $RAISE_MIN

      - name: Open PR to develop
        env:
          GH_TOKEN: ${{ secrets.ORG_CHECKOUT_TOKEN || github.token }}
          VERSION: ${{ steps.v.outputs.version }}
          RAISE_MIN: ${{ inputs.raise_min }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "::notice::The repo is already on Go $VERSION, nothing to update"
            exit 0
          fi
          git status --short
          branch="chore/go-sdk-$VERSION"
          git switch -c "$branch"
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore: Go SDK $VERSION"
          git push --force origin "$branch"

          min=$(awk '$1 == "go" { print $2; exit }' go.mod)
          if [ "$RAISE_MIN" = "true" ]; then
            impact="⚠️ **Raises the minimum version to Go ${min}.** Consumers on an older Go will not be able to upgrade the library: consider publishing it as a minor or major and announcing it."
          else
            impact="The minimum version for consumers **does not change** (still Go ${min}). Only the SDK used to develop and test changes."
          fi
          body=$(jq -n --arg v "$VERSION" --arg i "$impact" --arg b "$branch" '{
            head: $b, base: "develop",
            title: "chore: Go SDK \($v)",
            body: "Generated by the **go-sdk-update** task.\n\n- `.go-version` → `\($v)`\n- `go.mod` → `toolchain go\($v)`\n\n\($i)\n\nIf this is a Go minor change, check that the golangci-lint version pinned in `ci.yml` supports it.\n\n```release-note\nEgo is developed and tested with Go \($v).\n```"
          }')
          code=$(curl -sS -o resp.json -w '%{http_code}' -X POST \
                   -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                   "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls" -d "$body")
          case "$code" in
            201) echo "::notice::PR created: $(jq -r .html_url resp.json)"
                 curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                   "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/$(jq -r .number resp.json)/labels" \
                   -d '{"labels":["kind/deps"]}' >/dev/null || echo "::warning::Could not set the kind/deps label" ;;
            422) echo "::notice::A PR for $branch already exists; it was updated with this push" ;;
            *)   echo "::error::Could not create the PR ($code): $(jq -r .message resp.json)"; exit 1 ;;
          esac
