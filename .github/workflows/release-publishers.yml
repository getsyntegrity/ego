name: release-publishers

# release-publishers.yml is the explicit, dispatched-by-hand continuation of
# release.yml's prepare-publisher-bump job (#159, F4 PR-C). It is never
# triggered automatically: a human merges the publisher-bump PR that job
# printed the compare link and pull-request-creation command for, then
# dispatches this workflow with the SHA of a commit on main that contains
# the bump of the four publishers, requires the ego version it bumps to,
# and has a green build.yml run for that same SHA (usually the bump PR's
# merge commit, or a later main commit that still meets all three), plus
# that ego version. Only then are publisher tags created and their
# GitHub releases published. See docs/ci.md for the full two-stage flow.
# This workflow itself never opens a pull request and never pushes to
# main.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Full 40-character SHA of a commit on main that contains the bump of the four publishers, requires the given ego_version, and has a green build.yml run for that same SHA"
        required: true
        type: string
      ego_version:
        description: "ego root version publishers must require, e.g. v4.0.0"
        required: true
        type: string
      bump:
        description: "Version bump to apply to each publisher tag"
        required: false
        type: choice
        # minor, not patch: an untagged suffix-less publisher starts from
        # v0.0.0, so the first release must be v0.1.0 (#134), never v0.0.1.
        # Pinned by TestFirstPublisherRelease_DefaultBumpPlansV010ForEveryPublisher.
        default: minor
        options:
          - patch
          - minor
          - major
      dry_run:
        description: "Print the computed plan without creating or pushing anything"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

jobs:
  release-publishers:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout with ref: main and fetch-depth: 0 gives a full,
      # non-shallow clone of main's own history, checked out onto a local
      # "main" branch with "origin/main" pointing at the same commit — so
      # every commit that is genuinely an ancestor of main (including the
      # SHA input, once step (b) below confirms it is one) is already a
      # local object, and origin/main is resolvable without any further
      # fetch. fetch-tags: true (matching build.yml's release-plan job)
      # makes sure ego_version's root tag, and every existing publisher
      # tag, comes down too instead of relying on git's default
      # tag-auto-follow behavior.
      - name: Checkout main with full history and tags
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"

      # --- step (a): validate inputs -----------------------------------
      - name: Validate sha and ego_version format
        env:
          SHA: ${{ inputs.sha }}
          EGO_VERSION: ${{ inputs.ego_version }}
        run: |
          go run ./internal/cmd/releaseplan \
            -continuation-check-sha "$SHA" \
            -continuation-check-version "$EGO_VERSION"

      - name: Confirm ego_version tag exists and is on main
        env:
          EGO_VERSION: ${{ inputs.ego_version }}
        run: |
          if ! git rev-parse --verify "refs/tags/${EGO_VERSION}" >/dev/null 2>&1; then
            echo "::error::Tag ${EGO_VERSION} does not exist (checked after a full fetch of main and its tags)"
            exit 1
          fi
          if ! git merge-base --is-ancestor "refs/tags/${EGO_VERSION}" origin/main; then
            echo "::error::Tag ${EGO_VERSION} does not point at a commit on origin/main"
            exit 1
          fi
          echo "Confirmed tag ${EGO_VERSION} exists and points at a commit on origin/main"

      # --- step (b): sha is on main -------------------------------------
      - name: Confirm the bump commit is on main
        env:
          SHA: ${{ inputs.sha }}
        run: |
          if ! git rev-parse --verify "${SHA}^{commit}" >/dev/null 2>&1; then
            echo "::error::Commit ${SHA} is not resolvable (not found in the fetched history of origin/main)"
            exit 1
          fi
          if ! git merge-base --is-ancestor "${SHA}" origin/main; then
            echo "::error::Commit ${SHA} is not an ancestor of origin/main. It must be a commit on main that contains the bump of the four publishers, requires ego_version, and has a green build.yml run for that same SHA."
            exit 1
          fi
          echo "Confirmed commit ${SHA} is on origin/main"

      # --- step (c): releasegate passes for sha -------------------------
      - name: Wait for a green build.yml run on the bump commit
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GATE_REPO: ${{ github.repository }}
          GATE_SHA: ${{ inputs.sha }}
          GATE_ON_MAIN: "true"
        run: |
          go run ./internal/cmd/releasegate \
            -repo "$GATE_REPO" \
            -sha "$GATE_SHA" \
            -on-main "$GATE_ON_MAIN" \
            -timeout 20m \
            -interval 30s

      # --- step (d): every released publisher requires ego_version -----
      - name: Checkout the bump commit
        env:
          SHA: ${{ inputs.sha }}
        run: |
          git checkout --quiet "${SHA}"
          echo "Checked out ${SHA}"

      - name: Confirm publishers require ego_version
        env:
          EGO_VERSION: ${{ inputs.ego_version }}
        run: |
          go run ./internal/cmd/releaseplan \
            -repo-root . \
            -release scripts/ci/release-modules.txt \
            -continuation-check-required-version "${EGO_VERSION}"

      # --- steps (e)+(f): compute publisher tags, check conflicts ------
      # One releaseplan invocation, per -continuation-check-tag-conflicts'
      # own contract (it is only valid combined with
      # -continuation-plan-publishers). The release list read here is the
      # bump commit's own scripts/ci/release-modules.txt (checked out
      # above), filtered to drop the root ("."): -continuation-plan-
      # publishers refuses outright if the root is present, since the root
      # was already tagged by release.yml before this workflow ever runs.
      - name: Compute publisher tags and check for conflicts
        id: compute-tags
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          SCRATCH="$RUNNER_TEMP/release-publishers"
          mkdir -p "$SCRATCH"

          # Combined local+origin tag list. git ls-remote --tags can list a
          # peeled "^{}" entry for each annotated tag alongside its own
          # ref; strip that suffix and the "refs/tags/" prefix so both
          # lists contain bare tag names before merging and deduping.
          git tag -l > "$SCRATCH/tags-local.txt"
          git ls-remote --tags origin \
            | sed -E 's#^[0-9a-f]+[[:space:]]+refs/tags/##; s/\^\{\}$//' \
            > "$SCRATCH/tags-origin.txt"
          sort -u "$SCRATCH/tags-local.txt" "$SCRATCH/tags-origin.txt" > "$SCRATCH/tags-combined.txt"

          grep -v '^\.$' scripts/ci/release-modules.txt > "$SCRATCH/release-publishers-only.txt"

          go run ./internal/cmd/releaseplan \
            -repo-root . \
            -release "$SCRATCH/release-publishers-only.txt" \
            -tags "$SCRATCH/tags-combined.txt" \
            -bump "${BUMP}" \
            -continuation-plan-publishers \
            -continuation-check-tag-conflicts "$SCRATCH/tags-combined.txt" \
            -out-dir "$SCRATCH/plan"

          TAGS=$(jq -r '.modules[].nextTag' "$SCRATCH/plan/plan.json" | tr '\n' ' ')
          TAGS="${TAGS% }"

          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "Computed publisher tags: $TAGS"

      # --- step (g): re-check (b) and (f) right before tagging ---------
      # Only meaningful (and only run) when dry_run is false: a dry run's
      # plan is a point-in-time snapshot by definition, so re-checking it
      # would not change what was already printed, only spend an extra
      # releasegate-shaped round of git calls for no observable benefit.
      - name: Re-check ancestry and tag conflicts before tagging
        if: ${{ inputs.dry_run == false }}
        env:
          SHA: ${{ inputs.sha }}
          BUMP: ${{ inputs.bump }}
        run: |
          SCRATCH="$RUNNER_TEMP/release-publishers"

          git fetch origin main --quiet
          if ! git merge-base --is-ancestor "${SHA}" origin/main; then
            echo "::error::Commit ${SHA} is no longer confirmed as an ancestor of origin/main -- origin/main changed since this workflow started. Re-run the workflow from the top."
            exit 1
          fi

          git tag -l > "$SCRATCH/tags-local-recheck.txt"
          git ls-remote --tags origin \
            | sed -E 's#^[0-9a-f]+[[:space:]]+refs/tags/##; s/\^\{\}$//' \
            > "$SCRATCH/tags-origin-recheck.txt"
          sort -u "$SCRATCH/tags-local-recheck.txt" "$SCRATCH/tags-origin-recheck.txt" > "$SCRATCH/tags-combined-recheck.txt"

          go run ./internal/cmd/releaseplan \
            -repo-root . \
            -release "$SCRATCH/release-publishers-only.txt" \
            -tags "$SCRATCH/tags-combined-recheck.txt" \
            -bump "${BUMP}" \
            -continuation-plan-publishers \
            -continuation-check-tag-conflicts "$SCRATCH/tags-combined-recheck.txt" \
            -out-dir "$SCRATCH/plan-recheck"

          # The recomputed plan must match the plan already computed and
          # printed above tag for tag; if it doesn't, origin state changed
          # in the window between planning and tagging and pushing now
          # would tag different versions than what was shown for review.
          if ! diff <(jq -r '.modules[] | .dir + " " + .nextTag' "$SCRATCH/plan/plan.json" | sort) \
                    <(jq -r '.modules[] | .dir + " " + .nextTag' "$SCRATCH/plan-recheck/plan.json" | sort) >/dev/null; then
            echo "::error::Recomputed publisher tag plan differs from the plan computed earlier in this run. Origin state changed between planning and tagging; re-run the workflow from the top instead of tagging a stale plan."
            exit 1
          fi

          echo "Re-check passed: ${SHA} is still on origin/main and the tag plan is unchanged"

      # --- step (h), dry_run == false: create, push, release -----------
      - name: Create and push publisher tags
        if: ${{ inputs.dry_run == false }}
        env:
          SHA: ${{ inputs.sha }}
          TAGS: ${{ steps.compute-tags.outputs.tags }}
        run: |
          # An empty computed tag list should never happen -- the release
          # list always has publishers -- but "git push --atomic origin"
          # with no refspec (what an empty $TAGS would produce) is not the
          # intended no-op; treat it as a bug and fail loudly instead of
          # silently pushing nothing.
          if [ -z "${TAGS// /}" ]; then
            echo "::error::No publisher tags were computed (the computed tag list from the compute-tags step is empty) -- refusing to run an unscoped 'git push --atomic origin' with no refspec"
            exit 1
          fi

          for TAG in $TAGS; do
            git tag "$TAG" "${SHA}"
            echo "Created tag: $TAG"
          done

          git push --atomic origin $TAGS
          echo "Pushed all publisher tags."

      # Derives each publisher's tag from the plan this exact run computed
      # and just pushed ($SCRATCH/plan/plan.json), not from a fresh
      # highest-version tag lookup by prefix: an out-of-band higher tag
      # already on origin, or a concurrent dispatch of this same workflow,
      # could make such a lookup resolve to a different tag than the one
      # this run just pushed and create a release on the wrong version.
      #
      # The plan is read with a plain command substitution
      # (PLAN=$(jq ...)), not `done < <(jq ...)` feeding a `while read`
      # loop: a `jq` failure inside process substitution does not trip
      # `set -e`/`pipefail` -- the loop just sees EOF, runs zero
      # iterations, and the step exits 0 having silently created no
      # releases at all. A plain top-level `VAR=$(cmd)` assignment, by
      # contrast, does carry `cmd`'s exit status under `set -e`, so a
      # `jq` failure fails this step immediately; PLAN is also checked
      # for emptiness explicitly, since a successful-but-empty plan
      # (e.g. an empty modules array) would not trip `set -e` at all.
      #
      # Every planned tag is verified against ONE full, unfiltered
      # `git ls-remote --tags origin` listing, not a per-tag filtered
      # query: `git ls-remote --tags origin "refs/tags/<tag>"` returns
      # only the tag object's own SHA and never the peeled "^{}" commit
      # line, even for an annotated tag -- confirmed against a scratch
      # bare repo (see "PR #172 review fixes" in
      # odd/tasks/publisher-bump-flow-159.md for the exact commands and
      # output). A per-tag query's "prefer the peeled SHA" branch is
      # therefore dead code: it silently falls back to the tag object's
      # own SHA and fails the exact-SHA check for every annotated tag.
      # An unfiltered listing includes the peeled line for every
      # annotated tag alongside its own plain line, so each tag's actual
      # commit resolves correctly regardless of tag type.
      #
      # All-or-nothing: every planned tag is checked against that listing
      # in one pass *before* any release is created, so a later mismatch
      # never leaves some publishers released and others not.
      - name: Create publisher GitHub releases
        if: ${{ inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EGO_VERSION: ${{ inputs.ego_version }}
          SHA: ${{ inputs.sha }}
        run: |
          SCRATCH="$RUNNER_TEMP/release-publishers"

          PLAN=$(jq -r '.modules[] | .dir + " " + .nextTag' "$SCRATCH/plan/plan.json")
          if [ -z "$PLAN" ]; then
            echo "::error::No planned publisher tags found in $SCRATCH/plan/plan.json -- refusing to run a release step that would silently create zero releases"
            exit 1
          fi

          REMOTE_TAGS=$(git ls-remote --tags origin)

          # Pass 1: verify every planned tag exists on origin and
          # resolves to exactly $SHA before creating anything.
          while IFS=' ' read -r DIR TAG; do
            PEELED_SHA=$(printf '%s\n' "$REMOTE_TAGS" | awk -v ref="refs/tags/${TAG}^{}" '$2 == ref {print $1}')
            PLAIN_SHA=$(printf '%s\n' "$REMOTE_TAGS" | awk -v ref="refs/tags/${TAG}" '$2 == ref {print $1}')
            ACTUAL_SHA="${PEELED_SHA:-$PLAIN_SHA}"

            if [ -z "$ACTUAL_SHA" ]; then
              echo "::error::Planned tag ${TAG} for $(basename "$DIR") was not found on origin (expected it to already be pushed by the previous step)"
              exit 1
            fi
            if [ "$ACTUAL_SHA" != "$SHA" ]; then
              echo "::error::Planned tag ${TAG} for $(basename "$DIR") points at ${ACTUAL_SHA} on origin, expected ${SHA}"
              exit 1
            fi
          done <<< "$PLAN"

          # Pass 2: every planned tag is verified -- now create the releases.
          while IFS=' ' read -r DIR TAG; do
            PUB=$(basename "$DIR")
            PREFIX="publisher/${PUB}/v"
            VERSION="${TAG#${PREFIX}}"

            gh release create "${TAG}" \
              --title "${PUB} publisher v${VERSION}" \
              --notes "Release of \`${PUB}\` publisher v${VERSION}, updated to ego ${EGO_VERSION}." \
              --latest=false

            echo "Created release for ${PUB} publisher v${VERSION}"
          done <<< "$PLAN"

      # --- step (h), dry_run == true: print the plan, create nothing ---
      - name: Print dry-run plan
        if: ${{ inputs.dry_run == true }}
        env:
          SHA: ${{ inputs.sha }}
        run: |
          SCRATCH="$RUNNER_TEMP/release-publishers"
          {
            echo "## release-publishers dry run"
            echo
            echo "dry_run is true: no tags or releases were created."
            echo
            echo "Plan for commit \`${SHA}\`:"
            echo
            cat "$SCRATCH/plan/summary.md"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$SCRATCH/plan/summary.md"
