name: build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/readme.md'
      - '**/renovate.json'
  workflow_dispatch: {}
jobs:
  # plan always selects the full suite here (-all): main and
  # workflow_dispatch keep the complete gate, never impact-based selection.
  # It is still split from build so both workflows share one job shape, and
  # so the modules matrix depends on the same cheap job pull_request.yml's
  # does, not on the heavy root job.
  plan:
    runs-on: ubuntu-latest
    env:
      FORCE_COLOR: 1
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      modules: ${{ steps.select.outputs.modules }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          check-latest: false
          cache-dependency-path: "**/*.sum"
      - run: go version
      - name: Select packages and modules (full suite)
        id: select
        shell: bash
        run: |
          go run ./internal/cmd/ciselect -all -out-dir "$RUNNER_TEMP/ci"
          cat "$RUNNER_TEMP/ci/summary.md" >> "$GITHUB_STEP_SUMMARY"
          echo "mode=$(cat "$RUNNER_TEMP/ci/mode")" >> "$GITHUB_OUTPUT"
          echo "modules=$(cat "$RUNNER_TEMP/ci/modules.json")" >> "$GITHUB_OUTPUT"
      - name: Upload the selection plan
        uses: actions/upload-artifact@v4
        with:
          name: ciselect-plan
          path: ${{ runner.temp }}/ci
          retention-days: 7

  build:
    needs: plan
    if: needs.plan.outputs.mode != 'none'
    runs-on: ubuntu-latest
    env:
      FORCE_COLOR: 1
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          check-latest: false
          cache-dependency-path: "**/*.sum"
      - run: go version
      - name: Vendoring and Tidy
        run: go mod tidy && go mod vendor
      - name: Install dependencies
        run: |
          go mod download
      - name: Check architecture boundaries
        shell: bash
        env:
          GOFLAGS: -mod=vendor
        run: |
          go run ./internal/cmd/archcheck
      - name: Run Linter
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          args: --timeout 10m --config .golangci.yml
      - name: Download the selection plan
        uses: actions/download-artifact@v4
        with:
          name: ciselect-plan
          path: ${{ runner.temp }}/ci
      - name: Run tests
        shell: bash
        env:
          GOFLAGS: -mod=vendor
          GO_TEST_RACE: "1"
        run: |
          scripts/ci/go-test.sh "$RUNNER_TEMP/ci" coverage.out
      - name: Coverage summary
        if: always() && hashFiles('coverage.out') != ''
        shell: bash
        env:
          GOFLAGS: -mod=vendor
        run: |
          {
            echo "### Coverage"
            echo
            echo "Selection mode: \`full\`"
            echo
            echo '```'
            go tool cover -func=coverage.out | tail -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Coverage summary (no coverage)
        if: always() && hashFiles('coverage.out') == ''
        shell: bash
        run: |
          echo "Coverage: no coverage.out was produced." >> "$GITHUB_STEP_SUMMARY"

  modules:
    needs: plan
    if: needs.plan.outputs.modules != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.plan.outputs.modules) }}
    env:
      FORCE_COLOR: 1
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          check-latest: false
          cache-dependency-path: "${{ matrix.module }}/go.sum"
      - run: go version
      - name: Install golangci-lint
        shell: bash
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.13.1/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.13.1
      - name: Verify module
        shell: bash
        env:
          GO_TEST_RACE: "1"
        run: scripts/ci/verify-module.sh "${{ matrix.module }}"

  ci-gate:
    name: CI Gate
    needs: [plan, build, modules]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have succeeded, or been legitimately skipped
        shell: bash
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          MODULES_RESULT: ${{ needs.modules.result }}
        run: |
          echo "plan:    $PLAN_RESULT"
          echo "build:   $BUILD_RESULT"
          echo "modules: $MODULES_RESULT"
          status=0
          if [ "$PLAN_RESULT" != "success" ]; then
            echo "::error::plan job did not succeed ($PLAN_RESULT)"
            status=1
          fi
          # build and modules only ever skip because plan's own outputs
          # (mode == "none", or modules == "[]") said there was nothing for
          # them to do; when plan itself succeeded, that is the only way
          # either can be "skipped", so it is not a failure here. Any other
          # outcome (failure, cancelled) fails the gate.
          for job_result in "build:$BUILD_RESULT" "modules:$MODULES_RESULT"; do
            name=${job_result%%:*}
            result=${job_result#*:}
            case "$result" in
              success | skipped) ;;
              *)
                echo "::error::$name job did not succeed ($result)"
                status=1
                ;;
            esac
          done
          exit "$status"
