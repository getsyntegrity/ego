name: build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/readme.md'
      - '**/renovate.json'
  workflow_dispatch: {}
jobs:
  # plan always selects the full suite here (-all): main and
  # workflow_dispatch keep the complete gate, never impact-based selection.
  # It is still split out so both workflows share one job shape, and so the
  # modules matrix (which now also runs the root module, see below) depends
  # on the same cheap job pull_request.yml's does.
  plan:
    runs-on: ubuntu-latest
    env:
      FORCE_COLOR: 1
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      modules: ${{ steps.select.outputs.modules }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          check-latest: false
          cache-dependency-path: "**/*.sum"
      - run: go version
      - name: Select packages and modules (full suite)
        id: select
        shell: bash
        run: |
          go run ./internal/cmd/ciselect -all -out-dir "$RUNNER_TEMP/ci"
          cat "$RUNNER_TEMP/ci/summary.md" >> "$GITHUB_STEP_SUMMARY"
          echo "mode=$(cat "$RUNNER_TEMP/ci/mode")" >> "$GITHUB_OUTPUT"
          echo "modules=$(cat "$RUNNER_TEMP/ci/modules.json")" >> "$GITHUB_OUTPUT"
      - name: Upload the selection plan
        uses: actions/upload-artifact@v4
        with:
          name: ciselect-plan
          path: ${{ runner.temp }}/ci
          retention-days: 7

  # release-plan is a dry run of internal/cmd/releaseplan: it computes the
  # release order and next tag of every module scripts/ci/release-modules.txt
  # lists, and appends the result to the job summary. It never publishes,
  # tags, or touches release.yml's actual release path (PR-B) — see
  # docs/ci.md, "Release plan dry run (releaseplan)". It runs independently
  # of plan/modules (no needs:) so it never holds back the test/build gate,
  # but ci-gate below still requires it to succeed: a broken release plan on
  # main is exactly the kind of regression this dry run exists to surface
  # before anyone relies on it for a real release.
  release-plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          check-latest: false
          cache-dependency-path: "**/*.sum"
      - name: Compute the release plan (dry run)
        shell: bash
        run: |
          git tag -l > "$RUNNER_TEMP/release-plan-tags.txt"
          go run ./internal/cmd/releaseplan \
            -repo-root . \
            -release scripts/ci/release-modules.txt \
            -tags "$RUNNER_TEMP/release-plan-tags.txt" \
            -bump patch \
            -out-dir "$RUNNER_TEMP/releaseplan"
          cat "$RUNNER_TEMP/releaseplan/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the release plan
        uses: actions/upload-artifact@v4
        with:
          name: release-plan
          path: ${{ runner.temp }}/releaseplan
          retention-days: 7

  # modules fans out one job per selected module directory, root (".")
  # included (with -all every run here): the root module runs in the same
  # per-module job shape as every nested one, with its root-only steps
  # (download the plan, vendor, archcheck, lint, package-level tests,
  # coverage) conditional on `matrix.module == '.'`.
  modules:
    needs: plan
    if: needs.plan.outputs.modules != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.plan.outputs.modules) }}
    env:
      FORCE_COLOR: 1
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          check-latest: false
          cache-dependency-path: ${{ matrix.module == '.' && '**/*.sum' || format('{0}/go.sum', matrix.module) }}
      - run: go version
      - name: Install golangci-lint
        if: matrix.module != '.'
        shell: bash
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.13.1/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.13.1
      - name: Install govulncheck
        shell: bash
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      # A stable report path per matrix entry, computed once so the root and
      # nested-module steps below and the "Upload govulncheck report" step
      # all agree on where the JSON report lives; artifact names cannot
      # contain "/", so matrix.module ("." or "publisher/pulsar") is
      # sanitized here rather than in a workflow expression (GitHub Actions
      # expressions have no string-replace function).
      - name: Compute the govulncheck report path
        id: govulncheck-report
        shell: bash
        env:
          MODULE: ${{ matrix.module }}
        run: |
          safe="$(printf '%s' "$MODULE" | tr '/' '-')"
          echo "name=govulncheck-${safe}" >> "$GITHUB_OUTPUT"
          echo "path=${RUNNER_TEMP}/govulncheck-${safe}.json" >> "$GITHUB_OUTPUT"
      - name: Download the selection plan
        if: matrix.module == '.'
        uses: actions/download-artifact@v4
        with:
          name: ciselect-plan
          path: ${{ runner.temp }}/ci
      - name: Vendoring and Tidy
        if: matrix.module == '.'
        run: go mod tidy && go mod vendor
      - name: Install dependencies
        if: matrix.module == '.'
        run: go mod download
      # Nested modules already get an explicit build+vet from
      # scripts/ci/verify-module.sh; the root module previously had no
      # equivalent explicit step of its own. archcheck (go list ./...) and
      # the lint step below already cover the whole root module
      # unconditionally, same as these two new steps — only
      # scripts/ci/go-test.sh's test step is scoped to whatever ciselect
      # selected (always every included package here, via -all). These two
      # steps close the build/vet gap: `./...` from the repository root only
      # ever lists root-module packages (every nested module has its own
      # go.mod, so the go tool excludes it, and vendor/ is never listed
      # either — verified with `GOROOT= GOWORK=off GOFLAGS=-mod=vendor go
      # list ./...`, 0 matches for `publisher/` or `/vendor/`).
      - name: Build (root)
        if: matrix.module == '.'
        shell: bash
        env:
          GOFLAGS: -mod=vendor
        run: go build ./...
      - name: Vet (root)
        if: matrix.module == '.'
        shell: bash
        env:
          GOFLAGS: -mod=vendor
        run: go vet ./...
      - name: Check architecture boundaries
        if: matrix.module == '.'
        shell: bash
        env:
          GOFLAGS: -mod=vendor
        run: |
          go run ./internal/cmd/archcheck
      - name: Run Linter (root)
        if: matrix.module == '.'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          args: --timeout 10m --config .golangci.yml
      - name: Run tests (root)
        if: matrix.module == '.'
        shell: bash
        env:
          GOFLAGS: -mod=vendor
          GO_TEST_RACE: "1"
        run: |
          scripts/ci/go-test.sh "$RUNNER_TEMP/ci" coverage.out
      - name: Coverage summary (root)
        if: matrix.module == '.' && always() && hashFiles('coverage.out') != ''
        shell: bash
        env:
          GOFLAGS: -mod=vendor
          PLAN_MODE: ${{ needs.plan.outputs.mode }}
        run: |
          {
            echo "### Coverage"
            echo
            echo "Selection mode: \`$PLAN_MODE\`"
            echo
            echo '```'
            go tool cover -func=coverage.out | tail -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Coverage summary (root, no coverage)
        if: matrix.module == '.' && always() && hashFiles('coverage.out') == ''
        shell: bash
        run: |
          echo "Coverage: no coverage.out was produced." >> "$GITHUB_STEP_SUMMARY"
      - name: govulncheck (root)
        if: matrix.module == '.'
        shell: bash
        env:
          GOFLAGS: -mod=vendor
          GOVULNCHECK_REPORT: ${{ steps.govulncheck-report.outputs.path }}
        # -format json always exits 0 even when it finds vulnerabilities, so
        # the scan's own exit code is checked here (this step fails
        # immediately if it is non-zero) and internal/cmd/vulngate then
        # decides whether the report's findings are covered by
        # scripts/ci/govulncheck-allow.json (docs/ci.md, "The govulncheck
        # exception gate (vulngate)").
        run: |
          govulncheck -format json ./... > "$GOVULNCHECK_REPORT"
          go run ./internal/cmd/vulngate \
            -module . \
            -report "$GOVULNCHECK_REPORT" \
            -allow scripts/ci/govulncheck-allow.json
      - name: Verify module
        if: matrix.module != '.'
        shell: bash
        env:
          MODULE: ${{ matrix.module }}
          GO_TEST_RACE: "1"
          GOVULNCHECK_REPORT: ${{ steps.govulncheck-report.outputs.path }}
        run: scripts/ci/verify-module.sh "$MODULE"
      # if: always() so a module whose govulncheck step (or the exception
      # gate) failed still keeps its report as evidence for the reviewer
      # deciding whether a new allow-list entry is warranted. Guarded on the
      # report path output so this step is a no-op (not a failure) when
      # "Compute the govulncheck report path" itself never ran.
      - name: Upload the govulncheck report
        if: always() && steps.govulncheck-report.outputs.path != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.govulncheck-report.outputs.name }}
          path: ${{ steps.govulncheck-report.outputs.path }}
          retention-days: 7
          if-no-files-found: ignore

  # consumer proves that every published module path resolves the way an
  # outside consumer resolves it — a plain `go get`, no local `replace` —
  # against the exact tags a release would create (docs/ci.md, "Verify
  # clean consumer"; #134). Unlike pull_request.yml's consumer job, this one
  # always runs: plan on main always selects the full suite anyway (see
  # plan's own comment above), so no mode condition is needed here.
  consumer:
    name: Verify clean consumer
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          check-latest: false
          cache-dependency-path: "**/*.sum"
      - run: go version
      - name: Verify clean consumer
        shell: bash
        run: scripts/ci/verify-consumer.sh

  ci-gate:
    name: CI Gate
    needs: [plan, modules, release-plan, consumer]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have succeeded, or been legitimately skipped
        shell: bash
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          MODULES_RESULT: ${{ needs.modules.result }}
          RELEASE_PLAN_RESULT: ${{ needs.release-plan.result }}
          CONSUMER_RESULT: ${{ needs.consumer.result }}
        run: |
          echo "plan:         $PLAN_RESULT"
          echo "modules:      $MODULES_RESULT"
          echo "release-plan: $RELEASE_PLAN_RESULT"
          echo "consumer:     $CONSUMER_RESULT"
          status=0
          if [ "$PLAN_RESULT" != "success" ]; then
            echo "::error::plan job did not succeed ($PLAN_RESULT)"
            status=1
          fi
          # modules only ever skips because plan's own outputs.modules was
          # "[]" (see modules' if:); when plan succeeded, that is the only
          # way modules can be "skipped", so it is not a failure here. Any
          # other outcome (failure, cancelled) fails the gate.
          case "$MODULES_RESULT" in
            success | skipped) ;;
            *)
              echo "::error::modules job did not succeed ($MODULES_RESULT)"
              status=1
              ;;
          esac
          # release-plan is a dry run with no matrix skip condition, so
          # (unlike modules) "success" is the only acceptable outcome here.
          if [ "$RELEASE_PLAN_RESULT" != "success" ]; then
            echo "::error::release-plan job did not succeed ($RELEASE_PLAN_RESULT)"
            status=1
          fi
          # consumer has no skip condition on build.yml either (see its own
          # comment above), so "success" is the only acceptable outcome here.
          if [ "$CONSUMER_RESULT" != "success" ]; then
            echo "::error::consumer job did not succeed ($CONSUMER_RESULT)"
            status=1
          fi
          exit "$status"
