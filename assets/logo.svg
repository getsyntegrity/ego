<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" width="480" height="160">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C63FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C63FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Icon: abstract "u" mark with event-stream motif -->
  <g transform="translate(30, 20)">
    <!-- Rounded square background -->
    <rect x="0" y="0" width="120" height="120" rx="28" ry="28" fill="url(#iconGrad)" />

    <!-- Stylized "u" letterform in white -->
    <path d="M 36 34 L 36 60 C 36 76, 46 86, 60 86 C 74 86, 82 76, 82 60 L 82 34 M 82 60 L 82 88"
          fill="none" stroke="white" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Three small event dots streaming out -->
    <circle cx="94" cy="36" r="4" fill="white" opacity="0.5" />
    <circle cx="104" cy="28" r="3" fill="white" opacity="0.35" />
    <circle cx="112" cy="21" r="2.2" fill="white" opacity="0.2" />
  </g>

  <!-- Text: "Urd" -->
  <g transform="translate(170, 98)">
    <!-- "U" bold -->
    <text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="80" font-weight="700" fill="#1E293B" letter-spacing="-2">U</text>
    <!-- "rd" in gradient -->
    <text x="58" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="80" font-weight="300" fill="url(#grad)" letter-spacing="-2">rd</text>
  </g>

  <!-- Tagline -->
  <text x="172" y="124" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#64748B" letter-spacing="3">EVENT SOURCING FOR GO</text>
</svg>
